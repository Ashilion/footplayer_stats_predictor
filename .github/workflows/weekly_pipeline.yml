name: fbref-weekly

on:
  workflow_dispatch:
  schedule:
    - cron: '11 6 * * 1'

jobs:
  schedule_pipelines:
    runs-on: ubuntu-latest

    permissions:
      pages: write
      contents: write

    steps:
      - name: checkout repo content
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nbconvert ipykernel  # Required to run notebooks

      - name: execute jupyter notebook
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }} # This creates a virtual .env variable
        run: |
          jupyter nbconvert --to notebook --execute weekly_feature_pipeline.ipynb --inplace
          